    <style>
      #bite-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: radial-gradient(ellipse at 50% 35%, #18324a 0%, #0b1a2c 55%, #050b14 100%);
        color: #f6efe2;
        font-family: "Playfair Display", ui-serif, Georgia, serif;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        font-size: 13px;
        transition: opacity 520ms ease-out;
      }
      #bite-boot-splash.is-hiding { opacity: 0; pointer-events: none; }
      #bite-boot-splash .bite-boot-stage {
        position: relative;
        width: min(200px, 50vw);
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #bite-boot-splash .bite-boot-stage svg { width: 100%; height: 100%; overflow: visible; }
      #bite-boot-splash .bite-boot-waves {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 38vh;
        overflow: hidden;
        pointer-events: none;
      }
      #bite-boot-splash .bite-boot-waves svg {
        position: absolute;
        bottom: 0;
        left: -10%;
        width: 120%;
        height: 100%;
        display: block;
      }
      .bite-boot-boat {
        transform-origin: 100px 78px;
        animation: bite-boot-rock 4.2s ease-in-out infinite;
      }
      .bite-boot-wave { animation: bite-boot-wave 5.5s ease-in-out infinite; }
      .bite-boot-wave--back { animation-duration: 7s; animation-delay: -2s; opacity: 0.45; }
      .bite-boot-glow {
        position: absolute; inset: -10%;
        background: radial-gradient(circle at 50% 45%, rgba(159,207,214,0.18), transparent 60%);
        filter: blur(8px);
        pointer-events: none;
      }
      @keyframes bite-boot-rock {
        0%, 100% { transform: rotate(-4deg) translateY(0); }
        50% { transform: rotate(4deg) translateY(-2px); }
      }
      @keyframes bite-boot-wave {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
      }
      #bite-boot-splash .bite-boot-label {
        opacity: 0.75;
        font-weight: 400;
      }
      #bite-boot-splash .bite-boot-label::after {
        content: "";
        display: block;
        width: 28px;
        height: 1px;
        margin: 10px auto 0;
        background: rgba(246,239,226,0.4);
        animation: bite-boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes bite-boot-pulse {
        0%, 100% { opacity: 0.2; transform: scaleX(0.6); }
        50% { opacity: 0.9; transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bite-boot-boat, .bite-boot-wave, .bite-boot-label::after { animation: none; }
      }
    </style>
</head>
