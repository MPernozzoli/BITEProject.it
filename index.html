    <style>
      #bite-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: radial-gradient(circle at 50% 30%, #1a3047 0%, #0c1a2a 60%, #060d18 100%);
        color: #f6efe2;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 11px;
        transition: opacity 480ms ease-out;
      }
      #bite-boot-splash.is-hiding { opacity: 0; pointer-events: none; }
      #bite-boot-splash svg { width: min(180px, 50vw); height: auto; overflow: visible; }
      .bite-boot-boat { transform-origin: 60px 70px; animation: bite-boot-rock 3.4s ease-in-out infinite; }
      .bite-boot-wave { animation: bite-boot-wave 3.4s ease-in-out infinite; }
      .bite-boot-wave--back { animation-delay: -1.2s; opacity: 0.55; }
      @keyframes bite-boot-rock {
        0%, 100% { transform: rotate(-6deg) translateY(0); }
        50% { transform: rotate(6deg) translateY(2px); }
      }
      @keyframes bite-boot-wave {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-12px); }
      }
      #bite-boot-splash .bite-boot-label { opacity: 0.7; }
      @media (prefers-reduced-motion: reduce) {
        .bite-boot-boat, .bite-boot-wave { animation: none; }
      }
    </style>
</head>

          <path d="M28 76 L92 76 L88 80 L32 80 Z" fill="#b56a3a" />
        </g>
        <!-- Waves -->

          <path class="bite-boot-wave" d="M0 20 Q 20 8, 40 20 T 80 20 T 120 20 T 160 20 T 200 20 T 240 20 V 40 H 0 Z" fill="#3a6f86" />
        </g>
      </svg>
      <span class="bite-boot-label">BITE</span>
